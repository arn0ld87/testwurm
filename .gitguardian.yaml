# GitGuardian-Konfiguration für dieses Repository.
#
# kx/crates/kx-core/src/c2.rs ist das Wire-Vertrags-Modul des C2-Protokolls.
# Es enthält ausschließlich Typdefinitionen, Endpunktpfad-Konstanten und
# Test-Fixtures für das JSON-Format — kein Laufzeitcode, keine
# Konfigurationswerte, keine echten Credentials.
#
# GitGuardian hat die Passwortwerte in den Test-Fixtures als Secrets
# gemeldet, weil sie die Form echter Hashes haben (ein 32-stelliger
# Hex-Wert bzw. ein Default-Passwort). Sie sind synthetische Platzhalter,
# es ist nichts zu rotieren. Der Pfad wird deshalb ignoriert, statt die
# Werte zu verbiegen — in einer Datei ohne Laufzeitcode gibt es nichts
# zu schützen, und der Vertrag soll lesbar bleiben.
#
# Der Ignore gilt nur für genau diese Datei. Für kx-server, kx-agent,
# kx-cli, kx-win und kx-posix läuft die Erkennung uneingeschränkt.

#
# `kx/crates/kx-core/src/secretbox.rs` enthaelt das AEAD-Wrapping fuer die
# Beute. Die Test-Fixtures darin sehen wie Passwoerter aus ("Passwort",
# "Master-Key") — GitGuardian meldet sie deshalb als Secrets. Sie sind
# synthetische Platzhalter, es ist nichts zu rotieren.
#
# `kx/crates/kx-server/src/e2e_test.rs` enthaelt den Ende-zu-Ende-Test der
# Beutekette. Auch hier sind die Testwerte synthetisch; die Datei hat keinen
# Laufzeitcode.
#
# Der Ignore gilt nur fuer genau diese beiden Dateien. Fuer kx-server, kx-agent,
# kx-cli, kx-win und kx-posix laeuft die Erkennung uneingeschraenkt.

#
# Das Docker-Labor unter lab/ benutzt bewusst Wegwerf-Credentials
# (root:root im Zielcontainer, Beispielschluessel als Koeder fuer den
# Agenten). Sie existieren NUR innerhalb des isolierten --internal-
# Docker-Netzes, schuetzen nichts Echtes und sind Teil des
# Demonstrationszwecks (Default-Credential-Angriff zeigen).
# GitGuardian meldet sie als "Username Password" — False Positive.
# Echte Geheimnisse (privater Server-Key, Bearer-Token) entstehen zur
# Laufzeit unter lab/run/ und sind gitignored; sie stehen nie im Repo.
#
# Format version: 2 — das alte `ignore: paths:`-Schema (v1) liest der
# aktuelle Scanner nicht mehr; die Ignores waren damit wirkungslos.
version: 2
secret:
  ignored-paths:
    - "kx/crates/kx-core/src/c2.rs"
    - "kx/crates/kx-core/src/secretbox.rs"
    - "kx/crates/kx-server/src/e2e_test.rs"
    - "lab/**"
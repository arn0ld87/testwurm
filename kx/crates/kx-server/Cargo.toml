[package]
name = "kx-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Kx-C2-Server: Host-Registry, Secret-Store, Dashboard"

[dependencies]
kx-core = { workspace = true }
kx-tls = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rusqlite = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
# ServiceExt::oneshot — damit lassen sich Requests ohne echten TCP-Server
# direkt gegen den Router schicken (Auth-Tests).
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
# OsRng fuer den Ende-zu-Ende-Test der Beutekette.
rand_core.workspace = true

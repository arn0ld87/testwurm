[package]
name = "kx-core"
description = "Encoder-Kern: Dateiformat, Hybrid-KEM, AEAD-Chunks, Scan-Policy, Journal, Engine. Plattformneutral."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Der C2-Transport liegt in diesem Crate (siehe `src/c2/transport.rs`): er
# braucht das TLS-Vertrauen aus kx-tls und einen HTTP-Client. kx-tls haengt
# nicht an kx-core zurueck — die Kante existierte, wurde aber nie benutzt.
kx-tls = { workspace = true }
ureq = { workspace = true }
http = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hkdf.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
# ml-kem kommt aus dem Workspace: es gibt damit genau EINE Stelle, an der die
# Version steht. Eine eigene Deklaration hier (mit Caret-Bereich) hatte den
# Workspace-Pin umgangen — aufgeloest wurde 0.2.3 statt der beabsichtigten
# Version, und der Pin war damit wirkungslos.
#
# `deterministic` ist absichtlich AUS: es verlangt vom Aufrufer, das Kapselungs-
# geheimnis m selbst mitzubringen (EncapsulateDeterministic) - ein Fehler dort
# ist ein totaler Schluesselverlust. `zeroize` an, damit der DecapsulationKey
# beim Drop genullt wird (ZeroizeOnDrop nur mit Feature).
ml-kem.workspace = true
# Fuer die Traits `Encapsulate`/`Decapsulate` — ml-kem 0.2.3 re-exportiert sie
# nicht. Gleiche Version, die ml-kem aufloest.
kem.workspace = true
rand_core.workspace = true
zeroize.workspace = true
thiserror.workspace = true
base64.workspace = true

[dev-dependencies]
rand.workspace = true


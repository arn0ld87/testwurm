name: CI

# Gate für den Rust-Workspace unter kx/.
#
# Drei Jobs:
#   build    — baut und testet auf macOS und Linux (die Projektregel: der
#              Workspace muss auf beiden Plattformen bauen)
#   windows  — übersetzt den Windows-Pfad. Die Zweige hinter `cfg(windows)`
#              werden auf macOS und Linux nie übersetzt; ein Fehler dort
#              bleibt still, bis jemand das Binary auf Windows baut.
#   smoke    — startet den C2-Server und prüft die Authentifizierung am laufenden
#              System. Dieser Job fängt genau die Defekte, die ein reiner
#              Testlauf nicht sieht: ISSUE-1 (Start panic) und ISSUE-12 (offene API).
#
# fmt-Gate: der Workspace ist seit Commit 825511b formatiert, `cargo fmt --check`
# ist grün und wird hier erzwungen.
# Bewusst NOCH KEIN clippy-Gate: clippy meldet einige Warnungen, darunter das
# ungenutzte `insert_task` in kx-server (ISSUE-6). Das gehört als eigener
# Arbeitsstrang.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: kx
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kx

      - name: Formatierung prüfen
        run: cargo fmt --check

      - name: Bauen
        run: cargo build --workspace --all-targets

      - name: Testen
        run: cargo test --workspace

  windows:
    name: build-windows-target
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kx
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Abhängigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kx

      # `ring` bringt ein build.rs mit, das C übersetzt — dafür braucht es den
      # mingw-Compiler, auch wenn `cargo check` nicht linkt.
      - name: mingw-w64 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      # Der Wurm soll auf Windows laufen. Die Pfade hinter `cfg(windows)` werden
      # auf macOS und Linux nie übersetzt — ein Fehler dort bleibt still, bis
      # jemand das Binary auf Windows baut. `cargo check` genügt: übersetzen
      # muss der Code, linken muss er nur auf einer Windows-Maschine.
      - name: Der Windows-Pfad muss übersetzen
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  smoke:
    name: server-smoke-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kx
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kx

      - name: Release-Build des Servers
        run: cargo build --release -p kx-server

      - name: Server starten und die API prüfen
        run: |
          set -euo pipefail

          ./target/release/kx-server \
            --host 127.0.0.1 --port 18443 --db /tmp/kx-ci.db --token ci-token &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT

          # Auf den Listener warten, statt blind zu schlafen.
          for _ in $(seq 1 30); do
            if curl -sk -o /dev/null https://127.0.0.1:18443/; then break; fi
            sleep 1
          done

          code_ohne_token=$(curl -sk -o /dev/null -w '%{http_code}' \
            https://127.0.0.1:18443/api/hosts)
          code_falscher_token=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer falsch' https://127.0.0.1:18443/api/hosts)
          code_richtiger_token=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-token' https://127.0.0.1:18443/api/hosts)
          code_unbekannter_pfad=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-token' https://127.0.0.1:18443/gibtsnicht)

          echo "GET /api/hosts ohne Token:     ${code_ohne_token} (erwartet 401)"
          echo "GET /api/hosts falscher Token:  ${code_falscher_token} (erwartet 401)"
          echo "GET /api/hosts richtiger Token:  ${code_richtiger_token} (erwartet 200)"
          echo "GET /gibtsnicht:                ${code_unbekannter_pfad} (erwartet 404)"

          test "$code_ohne_token" = 401
          test "$code_falscher_token" = 401
          test "$code_richtiger_token" = 200
          test "$code_unbekannter_pfad" = 404
